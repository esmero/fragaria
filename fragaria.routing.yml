route_callbacks:
  - 'fragaria.route_subscriber:redirect_routes'
fragaria.datacite_settings_form:
  path: '/admin/config/archipelago/datacite'
  defaults:
    _form: '\Drupal\fragaria\Form\FragariaDataCiteConfigForm'
    _title: 'DataCite Integration Settings'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE