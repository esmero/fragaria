route_callbacks:
  - 'fragaria.route_subscriber:redirect_routes'
fragaria.datacite_settings_form:
  path: '/admin/config/archipelago/fragaria/datacite'
  defaults:
    _form: '\Drupal\fragaria\Form\FragariaDataCiteConfigForm'
    _title: 'DataCite DOI Integration Settings'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
fragaria.datacite_reports_form:
  path: '/admin/config/archipelago/fragaria/datacite/reports'
  defaults:
    _form: '\Drupal\fragaria\Form\FragariaDataCiteReportForm'
    _title: 'DataCite Logs'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE
